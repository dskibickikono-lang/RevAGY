name: Render mediów

# Kadry i filmy podstron (D-032, plan 3.3–3.5). Renderuje ze scen w tools/scenes/:
#   kadr — node tools/render-kadr.cjs <scena>   → public/assets/video/<scena>-kadr.jpg
#   film — node tools/render-videos.cjs <scena> → public/assets/video/<scena>.webm, .mp4, .jpg
# Wypisuje wagę każdego pliku z limitem z planu 3.5 i publikuje artefakt media-<sha>
# z plikami w układzie public/assets/video/…. Niczego nie wypycha: pliki z artefaktu dodaje
# do gałęzi etapu agent (gh run download), a CI etapu sprawdza je walidatorem.
on:
  pull_request:
    paths:
      - 'tools/scenes/**'
      - 'tools/render-kadr.cjs'
      - 'tools/render-videos.cjs'
      - '.github/workflows/render-media.yml'
  workflow_dispatch:
    inputs:
      scena:
        description: 'Nazwa sceny z tools/scenes/ bez .html, np. integracja-systemow'
        required: true
        type: string
      tryb:
        description: 'kadr = <scena>-kadr.jpg; film = <scena>.webm, .mp4 i .jpg'
        required: true
        default: kadr
        type: choice
        options: [kadr, film]

concurrency:
  group: render-media-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  render:
    name: Kadr albo film ze sceny
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Lista scen i tryb
        id: plan
        env:
          EVENT: ${{ github.event_name }}
          IN_SCENA: ${{ inputs.scena }}
          IN_TRYB: ${{ inputs.tryb }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -eu
          if [ "$EVENT" = "workflow_dispatch" ]; then
            sceny="$IN_SCENA"
            tryb="$IN_TRYB"
          else
            tryb=kadr
            # Płytki klon: pobieramy sam commit bazowy i porównujemy drzewa (historia nie jest potrzebna).
            git fetch --no-tags --depth=1 origin "$BASE_SHA"
            zmienione=$(git diff --name-only "$BASE_SHA" HEAD)
            echo "Zmienione pliki objęte zadaniem:"
            printf '%s\n' "$zmienione" | grep -E '^(tools/scenes/|tools/render-(kadr|videos)\.cjs$|\.github/workflows/render-media\.yml$)' || true
            # Zmienione sceny podstron (bez grafiki do udostępnień)...
            sceny=$(printf '%s\n' "$zmienione" | sed -n 's#^tools/scenes/\([a-z0-9-]*\)\.html$#\1#p' | grep -vx 'og-image' || true)
            # ...a przy zmianie wspólnych plików renderu: kadry wszystkich filmów z tools/podstrony.json, które mają scenę.
            if printf '%s\n' "$zmienione" | grep -Eq '^(tools/scenes/(engine\.js|scene\.css)|tools/render-(kadr|videos)\.cjs|\.github/workflows/render-media\.yml)$'; then
              wspolne=$(node -e "const d=require('./tools/podstrony.json');for(const s of d.strony||[])if(typeof s.film==='string'&&require('fs').existsSync('tools/scenes/'+s.film+'.html'))console.log(s.film)")
              sceny=$(printf '%s\n%s\n' "$sceny" "$wspolne" | grep -v '^$' | sort -u || true)
            fi
            # Usunięte sceny pomijamy.
            istniejace=""
            for s in $sceny; do [ -f "tools/scenes/$s.html" ] && istniejace="$istniejace $s"; done
            sceny="$istniejace"
          fi
          for s in $sceny; do
            printf '%s\n' "$s" | grep -Eqx '[a-z0-9]+(-[a-z0-9]+)*' || { echo "Zła nazwa sceny: $s" >&2; exit 1; }
            [ -f "tools/scenes/$s.html" ] || { echo "Brak sceny: tools/scenes/$s.html" >&2; exit 1; }
          done
          case "$tryb" in kadr|film) ;; *) echo "Zły tryb: $tryb" >&2; exit 1 ;; esac
          sceny=$(echo $sceny)
          echo "sceny=$sceny" >> "$GITHUB_OUTPUT"
          echo "tryb=$tryb" >> "$GITHUB_OUTPUT"
          echo "Sceny: ${sceny:-brak} · tryb: $tryb"

      - name: Chromium
        if: steps.plan.outputs.sceny != ''
        run: npx playwright install --with-deps chromium

      - name: ffmpeg (instalacja tylko przy braku)
        if: steps.plan.outputs.sceny != ''
        run: |
          if command -v ffmpeg >/dev/null 2>&1; then
            echo "ffmpeg jest w obrazie"
          else
            echo "Brak ffmpeg — instaluję"
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends ffmpeg
          fi
          ffmpeg -version | head -1

      - name: Render
        if: steps.plan.outputs.sceny != ''
        env:
          SCENY: ${{ steps.plan.outputs.sceny }}
          TRYB: ${{ steps.plan.outputs.tryb }}
        run: |
          set -eu
          for s in $SCENY; do
            if [ "$TRYB" = "kadr" ]; then
              node tools/render-kadr.cjs "$s"
            else
              node tools/render-videos.cjs "$s"
            fi
          done

      - name: Wagi, limity (plan 3.5) i pliki artefaktu
        if: steps.plan.outputs.sceny != ''
        env:
          SCENY: ${{ steps.plan.outputs.sceny }}
          TRYB: ${{ steps.plan.outputs.tryb }}
        run: |
          set -eu
          cel="$RUNNER_TEMP/media/public/assets/video"
          mkdir -p "$cel"
          blad=0
          echo '| Plik | Bajty | Limit | Stan |' >> "$GITHUB_STEP_SUMMARY"
          echo '|---|---:|---:|---|' >> "$GITHUB_STEP_SUMMARY"
          sprawdz() { # plik limit
            if [ ! -f "$1" ]; then echo "Brak pliku: $1" >&2; blad=1; return; fi
            b=$(stat -c %s "$1")
            if [ "$b" -gt "$2" ]; then stan="PONAD LIMIT"; blad=1; else stan="ok"; fi
            printf '%10s B  limit %8s B  %-11s %s\n' "$b" "$2" "$stan" "$1"
            echo "| \`$1\` | $b | $2 | $stan |" >> "$GITHUB_STEP_SUMMARY"
            cp "$1" "$cel/"
          }
          for s in $SCENY; do
            if [ "$TRYB" = "kadr" ]; then
              sprawdz "public/assets/video/$s-kadr.jpg" 150000
            else
              sprawdz "public/assets/video/$s.mp4" 1100000
              sprawdz "public/assets/video/$s.webm" 700000
              sprawdz "public/assets/video/$s.jpg" 150000
            fi
          done
          (cd "$RUNNER_TEMP/media" && find public -type f | sort | xargs sha256sum | tee SHA256SUMS)
          exit "$blad"

      # Także przy przekroczonym limicie, żeby dało się obejrzeć wynik.
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() && steps.plan.outputs.sceny != '' }}
        with:
          name: media-${{ github.event.pull_request.head.sha || github.sha }}
          path: ${{ runner.temp }}/media/
          if-no-files-found: error
          retention-days: 30
