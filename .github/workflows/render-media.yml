name: Render mediów

# Kadry i filmy podstron (D-022, D-032). Renderuje ze scen w tools/scenes/:
#   kadr — node tools/render-kadr.cjs <scena>   → public/assets/video/<scena>-kadr.jpg
#   film — node tools/render-videos.cjs <scena> → public/assets/video/<scena>.webm, .mp4, .jpg
# W PR tryb każdej sceny wybiera tools/media-plan.cjs: „film”, gdy wpis sceny w src/config/filmy.mjs
# ma ustawiony czas, inaczej „kadr”. Scenę w trybie „film” pomija, gdy jej trzy pliki są już w repozytorium,
# a scena i pliki renderu nie zmieniły się od poprzedniego wypchnięcia gałęzi.
# Wypisuje wagę każdego pliku z limitem z planu 3.5 i publikuje artefakt media-<sha>
# z plikami w układzie public/assets/video/…. Niczego nie wypycha: pliki z artefaktu dodaje
# do gałęzi etapu agent (gh run download), a CI etapu sprawdza je walidatorem.
on:
  pull_request:
    paths:
      - 'tools/scenes/**'
      - 'tools/render-kadr.cjs'
      - 'tools/render-videos.cjs'
      - 'tools/media-plan.cjs'
      - 'src/config/filmy.mjs'
      - '.github/workflows/render-media.yml'
  workflow_dispatch:
    inputs:
      scena:
        description: 'Nazwa sceny z tools/scenes/ bez .html, np. integracja-systemow'
        required: true
        type: string
      tryb:
        description: 'kadr = <scena>-kadr.jpg; film = <scena>.webm, .mp4 i .jpg'
        required: true
        default: kadr
        type: choice
        options: [kadr, film]

concurrency:
  group: render-media-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  render:
    name: Kadr albo film ze sceny
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Lista scen i tryb
        id: plan
        env:
          EVENT: ${{ github.event_name }}
          AKCJA: ${{ github.event.action }}
          IN_SCENA: ${{ inputs.scena }}
          IN_TRYB: ${{ inputs.tryb }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PRZED_SHA: ${{ github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -eu
          plik="$RUNNER_TEMP/plan.txt"
          if [ "$EVENT" = "workflow_dispatch" ]; then
            node tools/media-plan.cjs --scena="$IN_SCENA" --tryb="$IN_TRYB" > "$plik"
          else
            # Płytki klon: pobieramy sam commit bazowy i porównujemy drzewa (historia nie jest potrzebna).
            git fetch --no-tags --depth=1 origin "$BASE_SHA"
            git diff --name-only "$BASE_SHA" HEAD > "$RUNNER_TEMP/zmienione.txt"
            echo "Zmienione pliki objęte zadaniem:"
            grep -E '^(tools/scenes/|tools/render-(kadr|videos)\.cjs$|tools/media-plan\.cjs$|src/config/filmy\.mjs$|\.github/workflows/render-media\.yml$)' "$RUNNER_TEMP/zmienione.txt" || true
            # Zmiany od poprzedniego wypchnięcia gałęzi (tylko „synchronize”); bez nich film renderuje się zawsze.
            odpop=""
            if [ "$AKCJA" = "synchronize" ] && [ -n "$PRZED_SHA" ] \
              && git fetch --no-tags --depth=1 origin "$PRZED_SHA" "$HEAD_SHA" 2>/dev/null \
              && git diff --name-only "$PRZED_SHA" "$HEAD_SHA" > "$RUNNER_TEMP/od-poprzedniego.txt" 2>/dev/null; then
              odpop="--zmienione-od-poprzedniego=$RUNNER_TEMP/od-poprzedniego.txt"
              echo "Zmienione od poprzedniego wypchnięcia:"; cat "$RUNNER_TEMP/od-poprzedniego.txt"
            fi
            node tools/media-plan.cjs --zmienione="$RUNNER_TEMP/zmienione.txt" $odpop > "$plik"
          fi
          echo "Plan renderu (scena tryb):"
          cat "$plik"
          if [ -s "$plik" ]; then echo "jest=1" >> "$GITHUB_OUTPUT"; else echo "jest=" >> "$GITHUB_OUTPUT"; fi
          echo "plik=$plik" >> "$GITHUB_OUTPUT"

      - name: Chromium
        if: steps.plan.outputs.jest != ''
        run: npx playwright install --with-deps chromium

      - name: ffmpeg (instalacja tylko przy braku)
        if: steps.plan.outputs.jest != ''
        run: |
          if command -v ffmpeg >/dev/null 2>&1; then
            echo "ffmpeg jest w obrazie"
          else
            echo "Brak ffmpeg — instaluję"
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends ffmpeg
          fi
          ffmpeg -version | head -1

      - name: Render
        if: steps.plan.outputs.jest != ''
        env:
          PLAN: ${{ steps.plan.outputs.plik }}
        run: |
          set -eu
          while read -r s tryb; do
            if [ "$tryb" = "film" ]; then
              node tools/render-videos.cjs "$s"
            else
              node tools/render-kadr.cjs "$s"
            fi
          done < "$PLAN"

      - name: Wagi, limity (plan 3.5) i pliki artefaktu
        if: steps.plan.outputs.jest != ''
        env:
          PLAN: ${{ steps.plan.outputs.plik }}
        run: |
          set -eu
          cel="$RUNNER_TEMP/media/public/assets/video"
          mkdir -p "$cel"
          blad=0
          echo '| Plik | Bajty | Limit | Stan |' >> "$GITHUB_STEP_SUMMARY"
          echo '|---|---:|---:|---|' >> "$GITHUB_STEP_SUMMARY"
          sprawdz() { # plik limit
            if [ ! -f "$1" ]; then echo "Brak pliku: $1" >&2; blad=1; return; fi
            b=$(stat -c %s "$1")
            if [ "$b" -gt "$2" ]; then stan="PONAD LIMIT"; blad=1; else stan="ok"; fi
            printf '%10s B  limit %8s B  %-11s %s\n' "$b" "$2" "$stan" "$1"
            echo "| \`$1\` | $b | $2 | $stan |" >> "$GITHUB_STEP_SUMMARY"
            cp "$1" "$cel/"
          }
          while read -r s tryb; do
            if [ "$tryb" = "film" ]; then
              sprawdz "public/assets/video/$s.mp4" 1100000
              sprawdz "public/assets/video/$s.webm" 700000
              sprawdz "public/assets/video/$s.jpg" 150000
            else
              sprawdz "public/assets/video/$s-kadr.jpg" 150000
            fi
          done < "$PLAN"
          (cd "$RUNNER_TEMP/media" && find public -type f | sort | xargs sha256sum | tee SHA256SUMS)
          exit "$blad"

      # Także przy przekroczonym limicie, żeby dało się obejrzeć wynik.
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() && steps.plan.outputs.jest != '' }}
        with:
          name: media-${{ github.event.pull_request.head.sha || github.sha }}
          path: ${{ runner.temp }}/media/
          if-no-files-found: error
          retention-days: 30
