<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<title>Scena: przepływ (hero)</title>
<style>
  @font-face { font-family: "Onest"; font-weight: 100 900; src: url("../../site/assets/fonts/onest-latin-ext-wght-normal.woff2") format("woff2"); unicode-range: U+0100-02BA; }
  @font-face { font-family: "Onest"; font-weight: 100 900; src: url("../../site/assets/fonts/onest-latin-wght-normal.woff2") format("woff2"); unicode-range: U+0000-00FF; }
  html, body { margin: 0; background: #141114; }
  canvas { display: block; }
</style>
</head>
<body>
<canvas id="c" width="1600" height="900"></canvas>
<script>
/* Własna scena REVAGY: dane płyną z kanałów wejściowych przez agenta AI do systemów firmy.
   render(t) jest deterministyczne i okresowe (DURATION s), więc film zapętla się bez szwu. */
window.DURATION = 12;
window.SIZE = [1600, 900];
const cv = document.getElementById('c');
const ctx = cv.getContext('2d');
const W = 1600, H = 900, T = window.DURATION, TAU = Math.PI * 2;
const C = { night: '#141114', accent: '#ff5b14', rose: '#ff2e7e', plum: '#5a1d54', ok: '#19b77a', white: '#ffffff' };

/* Układ: cała sieć mieści się w prawej górnej części kadru (x 740–1560, y 60–500, środek 1150×280).
   Strona kadruje film właśnie na ten obszar i wygasza brzegi maską, więc tekst hero nie nachodzi na węzły. */
const agent = { x: 1150, y: 280, r: 66 };
const inputs = [
  { label: 'Formularz', x: 860, y: 120, color: C.rose },
  { label: 'E-mail', x: 820, y: 280, color: C.white },
  { label: 'Zamówienie PDF', x: 880, y: 440, color: C.accent },
];
const outputs = [
  { label: 'CRM', x: 1400, y: 100, color: C.rose },
  { label: 'Oferta', x: 1462, y: 220, color: C.accent },
  { label: 'ERP', x: 1462, y: 340, color: C.white },
  { label: 'Magazyn', x: 1400, y: 460, color: C.ok },
];
const blobs = [
  { color: C.accent, r: 460, cx: 1240, cy: 250, ax: 120, ay: 70, k: 1, ph: 0, a: .6 },
  { color: C.rose, r: 420, cx: 1480, cy: 520, ax: 90, ay: 90, k: 1, ph: 2.1, a: .46 },
  { color: C.plum, r: 560, cx: 880, cy: 200, ax: 110, ay: 60, k: 1, ph: 4.2, a: .8 },
  { color: C.accent, r: 300, cx: 1000, cy: 640, ax: 90, ay: 50, k: 2, ph: 1.2, a: .22 },
];

const frac = (v) => v - Math.floor(v);
const wob = (i, t, amp) => ({ dx: Math.sin(TAU * t / T + i * 1.7) * amp, dy: Math.cos(TAU * t / T * 2 + i * 2.3) * amp * .6 });

function bez(p0, p1, p2, p3, u) {
  const v = 1 - u;
  return {
    x: v * v * v * p0.x + 3 * v * v * u * p1.x + 3 * v * u * u * p2.x + u * u * u * p3.x,
    y: v * v * v * p0.y + 3 * v * v * u * p1.y + 3 * v * u * u * p2.y + u * u * u * p3.y,
  };
}
function link(a, b) {
  const dx = (b.x - a.x) * .5;
  return [a, { x: a.x + dx, y: a.y }, { x: b.x - dx, y: b.y }, b];
}
function pillWidth(label) {
  ctx.font = '600 25px Onest';
  return ctx.measureText(label).width + 78;
}
function roundRect(x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}

function drawPill(n, glow) {
  const w = pillWidth(n.label), h = 62, x = n.px - w / 2, y = n.py - h / 2;
  if (glow > 0) {
    ctx.save();
    ctx.shadowColor = n.color; ctx.shadowBlur = 50 * glow;
    ctx.fillStyle = `rgba(255,255,255,${.1 * glow})`;
    roundRect(x, y, w, h, 31); ctx.fill();
    ctx.restore();
  }
  ctx.fillStyle = 'rgba(28,24,29,.78)';
  roundRect(x, y, w, h, 31); ctx.fill();
  ctx.lineWidth = 1.5;
  ctx.strokeStyle = `rgba(255,255,255,${.2 + .5 * glow})`;
  roundRect(x, y, w, h, 31); ctx.stroke();
  ctx.fillStyle = n.color;
  ctx.beginPath(); ctx.arc(x + 31, n.py, 9 + 3 * glow, 0, TAU); ctx.fill();
  ctx.fillStyle = '#fff';
  ctx.font = '600 25px Onest';
  ctx.textBaseline = 'middle';
  ctx.fillText(n.label, x + 52, n.py + 1);
}

function drawLink(pts, alpha) {
  ctx.beginPath();
  ctx.moveTo(pts[0].x, pts[0].y);
  ctx.bezierCurveTo(pts[1].x, pts[1].y, pts[2].x, pts[2].y, pts[3].x, pts[3].y);
  ctx.strokeStyle = `rgba(255,255,255,${alpha})`;
  ctx.lineWidth = 2;
  ctx.stroke();
}
function drawPulse(pts, u, color) {
  for (let k = 14; k >= 0; k--) {
    const uu = u - k * .012;
    if (uu < 0 || uu > 1) continue;
    const p = bez(pts[0], pts[1], pts[2], pts[3], uu);
    const fade = Math.sin(Math.PI * Math.min(1, Math.max(0, uu)));
    const a = (1 - k / 15) * (.25 + .75 * fade);
    ctx.beginPath();
    ctx.arc(p.x, p.y, (k === 0 ? 7 : 5.5) * (1 - k / 22), 0, TAU);
    ctx.fillStyle = color;
    ctx.globalAlpha = a * (k === 0 ? 1 : .55);
    if (k === 0) { ctx.shadowColor = color; ctx.shadowBlur = 26; }
    ctx.fill();
    ctx.shadowBlur = 0;
  }
  ctx.globalAlpha = 1;
}

window.render = (t) => {
  t = ((t % T) + T) % T;
  ctx.globalAlpha = 1;
  ctx.fillStyle = C.night;
  ctx.fillRect(0, 0, W, H);

  // poświaty
  ctx.globalCompositeOperation = 'lighter';
  for (const b of blobs) {
    const x = b.cx + Math.sin(TAU * b.k * t / T + b.ph) * b.ax;
    const y = b.cy + Math.cos(TAU * b.k * t / T + b.ph * 1.3) * b.ay;
    const g = ctx.createRadialGradient(x, y, 0, x, y, b.r);
    g.addColorStop(0, b.color);
    g.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.globalAlpha = b.a;
    ctx.fillStyle = g;
    ctx.fillRect(x - b.r, y - b.r, b.r * 2, b.r * 2);
  }
  ctx.globalAlpha = 1;
  ctx.globalCompositeOperation = 'source-over';

  // przyciemnienie, żeby szkło i tekst były czytelne
  ctx.fillStyle = 'rgba(20,17,20,.34)';
  ctx.fillRect(0, 0, W, H);

  // siatka punktów
  ctx.fillStyle = 'rgba(255,255,255,.07)';
  for (let x = 40; x < W; x += 48) for (let y = 30; y < H; y += 48) ctx.fillRect(x, y, 2, 2);

  // pozycje z lekkim unoszeniem
  inputs.forEach((n, i) => { const w = wob(i, t, 6); n.px = n.x + w.dx; n.py = n.y + w.dy; });
  outputs.forEach((n, i) => { const w = wob(i + 5, t, 6); n.px = n.x + w.dx; n.py = n.y + w.dy; });
  const A = { x: agent.x, y: agent.y + Math.sin(TAU * t / T) * 6 };

  const inLinks = inputs.map((n) => link({ x: n.px + pillWidth(n.label) / 2, y: n.py }, { x: A.x - agent.r - 6, y: A.y }));
  const outLinks = outputs.map((n) => link({ x: A.x + agent.r + 6, y: A.y }, { x: n.px - pillWidth(n.label) / 2, y: n.py }));
  inLinks.forEach((l) => drawLink(l, .2));
  outLinks.forEach((l) => drawLink(l, .2));

  // impulsy: 3 obiegi na pętlę, wejścia i wyjścia przesunięte w fazie
  const inGlow = inputs.map(() => 0), outGlow = outputs.map(() => 0);
  let agentHit = 0;
  inLinks.forEach((l, i) => {
    const u = frac(t / T * 3 + i / 3);
    drawPulse(l, u, inputs[i].color === C.white ? '#ffd9c7' : inputs[i].color);
    inGlow[i] = Math.max(0, 1 - u * 5);
    agentHit = Math.max(agentHit, Math.max(0, 1 - (1 - u) * 6));
  });
  outLinks.forEach((l, i) => {
    const u = frac(t / T * 3 + i / 4 + .5);
    drawPulse(l, u, outputs[i].color === C.white ? '#ffd9c7' : outputs[i].color);
    outGlow[i] = Math.max(0, 1 - (1 - u) * 5);
  });

  inputs.forEach((n, i) => drawPill(n, inGlow[i]));
  outputs.forEach((n, i) => drawPill(n, outGlow[i]));

  // agent
  const pulse = .5 + .5 * Math.sin(TAU * t / T * 6);
  for (let k = 0; k < 3; k++) {
    const rr = agent.r + 24 + k * 30 + frac(t / T * 6) * 30;
    ctx.beginPath(); ctx.arc(A.x, A.y, rr, 0, TAU);
    ctx.strokeStyle = `rgba(255,255,255,${Math.max(0, .16 - (rr - agent.r - 24) / 90 * .16)})`;
    ctx.lineWidth = 1.5; ctx.stroke();
  }
  ctx.save();
  ctx.shadowColor = C.accent; ctx.shadowBlur = 60 + 30 * agentHit + 14 * pulse;
  const g = ctx.createLinearGradient(A.x - agent.r, A.y - agent.r, A.x + agent.r, A.y + agent.r);
  g.addColorStop(0, '#ff7a2e'); g.addColorStop(.55, C.accent); g.addColorStop(1, C.rose);
  ctx.fillStyle = g;
  ctx.beginPath(); ctx.arc(A.x, A.y, agent.r + 3 * agentHit, 0, TAU); ctx.fill();
  ctx.restore();
  ctx.save();
  ctx.translate(A.x, A.y); ctx.rotate(TAU * t / T);
  ctx.setLineDash([10, 14]); ctx.lineWidth = 2.5; ctx.strokeStyle = 'rgba(255,255,255,.55)';
  ctx.beginPath(); ctx.arc(0, 0, agent.r + 16, 0, TAU); ctx.stroke();
  ctx.restore();
  ctx.fillStyle = C.night;
  ctx.textAlign = 'center';
  ctx.font = '800 27px Onest'; ctx.fillText('Agent', A.x, A.y - 13);
  ctx.font = '800 27px Onest'; ctx.fillText('AI', A.x, A.y + 18);
  ctx.textAlign = 'left';
};

window.ready = document.fonts.load('600 25px Onest').then(() => document.fonts.load('800 30px Onest')).then(() => { window.render(0); return true; });
// podgląd na żywo, gdy plik otwarto ręcznie w przeglądarce
if (!navigator.webdriver) { const loop = (ms) => { window.render(ms / 1000); requestAnimationFrame(loop); }; window.ready.then(() => requestAnimationFrame(loop)); }
</script>
</body>
</html>
