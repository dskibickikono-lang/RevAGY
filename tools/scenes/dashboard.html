<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<title>Scena: pulpit zarządczy</title>
<link rel="stylesheet" href="scene.css">
<style>
  #stage { width: 1280px; height: 720px; }
  .g1 { width: 620px; height: 620px; background: var(--accent); right: -160px; top: -220px; opacity: .55; }
  .g2 { width: 560px; height: 560px; background: var(--rose); left: -200px; top: 240px; opacity: .4; }
  .g3 { width: 520px; height: 520px; background: var(--plum); left: 380px; top: -240px; opacity: .85; }
  .veil { position: absolute; inset: 0; background: rgba(20, 17, 20, .4); }

  /* Kadr karty przycina boki i przykrywa dół gradientem — treść trzymamy w górnym środku. */
  .board { position: absolute; left: 170px; right: 170px; top: 40px; display: grid; gap: 18px; }
  .head { display: flex; align-items: center; justify-content: space-between; font-family: var(--mono); font-size: 15px; color: var(--dim); }
  .head b { color: #fff; font-family: var(--display); font-size: 24px; letter-spacing: -.02em; }
  .live { display: inline-flex; align-items: center; gap: 8px; }
  .live i { width: 9px; height: 9px; border-radius: 50%; background: var(--ok); }
  .tiles { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; }
  .tile { background: rgba(28, 24, 29, .8); border: 1.5px solid var(--line); border-radius: 24px; padding: 20px 22px; display: grid; gap: 6px; }
  .tile span { font-size: 15.5px; color: var(--dim); }
  .tile b { font-family: var(--display); font-size: 46px; font-weight: 750; letter-spacing: -.04em; line-height: 1; font-variant-numeric: tabular-nums; }
  .tile em { font-style: normal; font-family: var(--mono); font-size: 14px; color: var(--ok); }
  .tile.hot { background: var(--accent); color: var(--ink); border-color: transparent; }
  .tile.hot span, .tile.hot em { color: var(--ink); }
  .chart { background: rgba(28, 24, 29, .8); border: 1.5px solid var(--line); border-radius: 24px; padding: 22px; display: grid; gap: 12px; }
  .chart p { font-size: 15.5px; color: var(--dim); display: flex; justify-content: space-between; }
  .chart p b { color: #fff; font-weight: 500; font-family: var(--mono); font-size: 14px; }
  svg { display: block; width: 100%; height: 300px; overflow: visible; }
</style>
</head>
<body>
<div id="stage">
  <div class="glow g1" id="g1"></div><div class="glow g2" id="g2"></div><div class="glow g3" id="g3"></div>
  <div class="veil"></div>
  <div class="board" id="board">
    <div class="head t" data-at="0.3" data-dy="-10"><b>Pulpit zarządczy</b><span class="live"><i id="dot"></i>dane na żywo · listopad</span></div>
    <div class="tiles">
      <div class="tile t" data-at="0.5"><span>Zadania wykonane</span><b id="k1">0</b><em>+18% m/m</em></div>
      <div class="tile hot t" data-at="0.65"><span>Godziny odzyskane</span><b id="k2">0</b><em>= 0,8 etatu</em></div>
      <div class="tile t" data-at="0.8"><span>Czas odpowiedzi</span><b id="k3">0</b><em>było 4 h 10 min</em></div>
    </div>
    <div class="chart t" data-at="1.0">
      <p><span>Zautomatyzowane zadania tygodniowo</span><b>ostatnie 12 tygodni</b></p>
      <svg viewBox="0 0 900 300" id="svg" preserveAspectRatio="none">
        <defs>
          <linearGradient id="barG" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ff5b14"/><stop offset="1" stop-color="#ff2e7e"/></linearGradient>
        </defs>
        <g id="grid"></g>
        <g id="bars"></g>
        <path id="line" fill="none" stroke="#fff" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
        <circle id="tip" r="8" fill="#fff"/>
      </svg>
    </div>
  </div>
</div>

<script src="engine.js"></script>
<script>
window.DURATION = 10;
window.SIZE = [1280, 720];
window.POSTER_AT = 6;
const { clamp, prog, lerp, apply } = TL;
const TAU = Math.PI * 2;
const NS = 'http://www.w3.org/2000/svg';
const pl = new Intl.NumberFormat('pl-PL', { useGrouping: 'always' });
const data = [210, 248, 236, 290, 334, 318, 372, 405, 441, 428, 486, 520];
const MAX = 560, CW = 900, CH = 300, n = data.length, slot = CW / n, bw = slot * 0.56;

const grid = document.getElementById('grid'), barsG = document.getElementById('bars');
for (let i = 1; i <= 3; i++) {
  const l = document.createElementNS(NS, 'line');
  const y = CH - (CH * i) / 4;
  l.setAttribute('x1', 0); l.setAttribute('x2', CW); l.setAttribute('y1', y); l.setAttribute('y2', y);
  l.setAttribute('stroke', 'rgba(255,255,255,.1)'); l.setAttribute('stroke-dasharray', '4 8');
  grid.appendChild(l);
}
const bars = data.map((v, i) => {
  const r = document.createElementNS(NS, 'rect');
  r.setAttribute('x', i * slot + (slot - bw) / 2); r.setAttribute('width', bw); r.setAttribute('rx', 9);
  r.setAttribute('fill', i >= n - 4 ? 'url(#barG)' : 'rgba(255,255,255,.16)');
  barsG.appendChild(r);
  return r;
});
const pts = data.map((v, i) => [i * slot + slot / 2, CH - (v / MAX) * CH * 0.9 - 26]);
const line = document.getElementById('line'), tip = document.getElementById('tip');
const board = document.getElementById('board'), dot = document.getElementById('dot');
const k1 = document.getElementById('k1'), k2 = document.getElementById('k2'), k3 = document.getElementById('k3');
const glows = ['g1', 'g2', 'g3'].map((id) => document.getElementById(id));

window.render = (t) => {
  const T = window.DURATION;
  t = ((t % T) + T) % T;
  apply(t);
  glows.forEach((g, i) => {
    const a = TAU * t / T + i * 2.1;
    g.style.transform = `translate(${(Math.sin(a) * 60).toFixed(1)}px, ${(Math.cos(a) * 44).toFixed(1)}px)`;
  });
  board.style.opacity = (prog(t, 0, 0.6) * (1 - prog(t, 9.2, 0.7))).toFixed(4);
  dot.style.opacity = (0.45 + 0.55 * Math.abs(Math.sin(TAU * t / 2))).toFixed(3);

  bars.forEach((r, i) => {
    const p = prog(t, 1.3 + i * 0.09, 0.9);
    const h = Math.max(0.01, (data[i] / MAX) * CH * 0.9 * p);
    r.setAttribute('y', CH - h); r.setAttribute('height', h);
  });

  // linia rysowana od lewej
  const lp = prog(t, 2.2, 2.2) * (n - 1);
  let d = '';
  let tx = pts[0][0], ty = pts[0][1];
  for (let i = 0; i < n; i++) {
    if (i <= lp) { d += `${i ? 'L' : 'M'}${pts[i][0]} ${pts[i][1]} `; tx = pts[i][0]; ty = pts[i][1]; }
    else if (i - 1 < lp) {
      const f = lp - (i - 1);
      tx = lerp(pts[i - 1][0], pts[i][0], f); ty = lerp(pts[i - 1][1], pts[i][1], f);
      d += `L${tx.toFixed(1)} ${ty.toFixed(1)} `;
    }
  }
  line.setAttribute('d', d || 'M0 0');
  line.style.opacity = prog(t, 2.2, 0.2).toFixed(3);
  tip.setAttribute('cx', tx); tip.setAttribute('cy', ty);
  tip.setAttribute('r', (7 + 2.5 * Math.sin(TAU * t / 1.25)).toFixed(2));
  tip.style.opacity = prog(t, 2.2, 0.2).toFixed(3);

  const c = prog(t, 0.9, 2.6);
  k1.textContent = pl.format(Math.round(4812 * c));
  k2.textContent = `${pl.format(Math.round(126 * c))} h`;
  k3.textContent = `${Math.round(lerp(250, 3, c))} min`;
};
TL.live(window.render, window.DURATION);
</script>
</body>
</html>
