<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<title>Grafika do udostępniania (1200×630)</title>
<link rel="stylesheet" href="scene.css">
<style>
  #stage { width: 1200px; height: 630px; }
  .g1 { width: 620px; height: 620px; background: var(--accent); right: -120px; top: -180px; opacity: .6; }
  .g2 { width: 520px; height: 520px; background: var(--rose); right: -160px; top: 260px; opacity: .45; }
  .g3 { width: 560px; height: 560px; background: var(--plum); left: 300px; top: -260px; opacity: .85; }
  .veil { position: absolute; inset: 0; background: linear-gradient(90deg, rgba(20, 17, 20, .82) 0%, rgba(20, 17, 20, .35) 60%, rgba(20, 17, 20, .1) 100%); }
  .copy { position: absolute; left: 72px; top: 72px; bottom: 72px; width: 640px; display: flex; flex-direction: column; }
  .logo { display: flex; align-items: center; gap: 14px; font-family: var(--display); font-weight: 800; font-size: 34px; letter-spacing: -.02em; }
  .logo svg { width: 48px; height: 48px; }
  h1 { margin-top: auto; font-family: var(--display); font-weight: 750; font-size: 92px; line-height: .98; letter-spacing: -.04em; }
  p { margin-top: 26px; font-size: 28px; color: rgba(255, 255, 255, .84); }
  .url { margin-top: 30px; align-self: flex-start; font-family: var(--display); font-weight: 650; font-size: 24px; padding: 12px 24px; border-radius: 999px; background: #fff; color: var(--ink); }
  .node { position: absolute; right: 150px; top: 205px; width: 220px; height: 220px; border-radius: 50%; background: linear-gradient(135deg, #ff7a2e, var(--accent) 55%, var(--rose)); display: grid; place-items: center; text-align: center; font-family: var(--display); font-weight: 800; font-size: 44px; line-height: 1; color: var(--ink); box-shadow: 0 0 90px rgba(255, 91, 20, .7); }
  .ring { position: absolute; right: 110px; top: 165px; width: 300px; height: 300px; border-radius: 50%; border: 3px dashed rgba(255, 255, 255, .5); }
  .ring.r2 { right: 60px; top: 115px; width: 400px; height: 400px; border: 1.5px solid rgba(255, 255, 255, .16); }
  .pill { position: absolute; display: flex; align-items: center; gap: 12px; height: 54px; padding: 0 22px; border-radius: 999px; background: rgba(28, 24, 29, .82); border: 1.5px solid rgba(255, 255, 255, .22); font-family: var(--display); font-weight: 600; font-size: 22px; }
  .pill i { width: 16px; height: 16px; border-radius: 50%; }
</style>
</head>
<body>
<div id="stage">
  <div class="glow g1"></div><div class="glow g2"></div><div class="glow g3"></div>
  <div class="veil"></div>
  <div class="ring r2"></div><div class="ring"></div>
  <div class="node">Agent<br>AI</div>
  <div class="pill" style="right:390px;top:120px"><i style="background:var(--rose)"></i>CRM</div>
  <div class="pill" style="right:30px;top:96px"><i style="background:var(--accent)"></i>Oferta</div>
  <div class="pill" style="right:20px;top:470px"><i style="background:#fff"></i>ERP</div>
  <div class="pill" style="right:380px;top:480px"><i style="background:var(--ok)"></i>Faktury</div>
  <div class="copy">
    <div class="logo">
      <svg viewBox="0 0 32 32"><rect width="32" height="32" rx="9" fill="#fff"/><path d="M10 23V9h7.2a4.6 4.6 0 0 1 1.9 8.8L22.5 23h-4l-2.9-4.6H13.5V23zm3.5-7.6h3.3a1.7 1.7 0 0 0 0-3.4h-3.3z" fill="#141114"/></svg>
      REVAGY
    </div>
    <h1>Procesy, które robią się same</h1>
    <p>Automatyzacja i AI dla firm B2B</p>
    <span class="url">revagy.pl</span>
  </div>
</div>
<script>
  window.SIZE = [1200, 630];
  window.ready = document.fonts.ready.then(() => true);
</script>
</body>
</html>
