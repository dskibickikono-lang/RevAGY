# Nagłówki bezpieczeństwa strony revagy.pl.
# Instalacja: /etc/nginx/snippets/revagy-naglowki.conf
# Dołączane w każdym bloku location, bo add_header w location zastępuje nagłówki z poziomu server.

add_header Strict-Transport-Security "max-age=31536000" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "SAMEORIGIN" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://stats.revagy.pl; connect-src 'self' https://stats.revagy.pl; img-src 'self' data: https://stats.revagy.pl; style-src 'self' 'unsafe-inline'; font-src 'self'; media-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'self'; form-action 'self'; upgrade-insecure-requests" always;
