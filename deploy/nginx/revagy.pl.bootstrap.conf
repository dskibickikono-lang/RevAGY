# ARCHIWALNY SZABLON POMOCNICZY (nieużywany w wariancie A z Caddy na :80/:443).
# Wariant produkcyjny używa Caddy (TLS Let's Encrypt) → lokalny nginx 127.0.0.1:8092 (revagy.pl.conf).
# Poniższa konfiguracja dotyczy wyłącznie hipotetycznego środowiska bez Caddy przed nginx.
# revagy.pl — konfiguracja startowa (tylko HTTP), używana do czasu wydania certyfikatu.
# Instalacja: /etc/nginx/sites-available/revagy.pl.conf + dowiązanie w sites-enabled.
# Po wydaniu certyfikatu zastępuje ją deploy/nginx/revagy.pl.conf.

server {
    listen 80;
    listen [::]:80;
    server_name revagy.pl www.revagy.pl stats.revagy.pl;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type text/plain;
    }

    location / {
        return 503 "Trwa uruchamianie strony.\n";
        default_type text/plain;
    }
}
