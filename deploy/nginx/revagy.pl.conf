# revagy.pl — wariant A: Caddy (TLS, :80/:443) → nginx na 127.0.0.1:8092.
# Strona (pliki statyczne z /var/www/revagy.pl/current) + stats.revagy.pl (Matomo 127.0.0.1:8090 i raport GoAccess).
# Instalacja: /etc/nginx/sites-available/revagy.pl.conf + dowiązanie w sites-enabled.
# UWAGA: modyfikacja aktywnego vhosta na produkcji wymaga osobnej zgody właściciela (samo wydanie HTML jej nie wymaga).

# Ufamy adresowi klienta wyłącznie od lokalnego Caddy
set_real_ip_from 127.0.0.1;
set_real_ip_from ::1;
real_ip_header X-Forwarded-For;

limit_req_zone $binary_remote_addr zone=fg_submit:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=fg_status:1m rate=30r/m;
log_format fg_noquery '$remote_addr [$time_local] "$request_method $uri" $status $body_bytes_sent $request_time';

# Nieznane nazwy: zamknięcie połączenia
server {
    listen 127.0.0.1:8092 default_server;
    server_name _;
    access_log off;
    return 444;
}

# --- www → domena główna ---
server {
    listen 127.0.0.1:8092;
    server_name www.revagy.pl;

    access_log /var/log/nginx/revagy/access.log combined;
    return 301 https://revagy.pl$request_uri;
}

# --- strona ---
server {
    listen 127.0.0.1:8092;
    server_name revagy.pl;

    # Bez portu 8092 i schematu http w przekierowaniach generowanych przez nginx
    absolute_redirect off;

    root /var/www/revagy.pl/current;
    index index.html;
    charset utf-8;

    # Pełne logi: IP, czas, adres, kod, strona odsyłająca, user agent. Rotacja: 90 dni.
    access_log /var/log/nginx/revagy/access.log combined;
    error_log  /var/log/nginx/revagy/error.log warn;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json application/manifest+json application/xml image/svg+xml text/plain;

    error_page 404 /404.html;

    location = /api/kontakt {
        limit_except POST { deny all; }
        client_max_body_size 16k;
        limit_req zone=fg_submit burst=5 nodelay;
        limit_req_status 429;
        access_log /var/log/nginx/revagy/forms-gateway.access.log fg_noquery;
        proxy_pass http://127.0.0.1:8095/v1/submit;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_connect_timeout 3s;
        proxy_read_timeout 20s;
        include snippets/revagy-naglowki.conf;
        add_header Cache-Control "no-store" always;
    }
    location ~ "^/api/kontakt/status/(ld_[0-9a-f]{32})$" {
        limit_except GET { deny all; }
        limit_req zone=fg_status burst=5 nodelay;
        limit_req_status 429;
        access_log /var/log/nginx/revagy/forms-gateway.access.log fg_noquery;
        proxy_pass http://127.0.0.1:8095/v1/status/$1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header Authorization $http_authorization;
        include snippets/revagy-naglowki.conf;
        add_header Cache-Control "no-store" always;
    }
    location /api/ { return 404; }

    # Podstrony wycofanej odsłony P0–P2 (wydanie dc984b6, 21.11.2026): stałe przekierowanie na treść strony głównej
    location = /oferta.html                     { return 301 /#pakiety; }
    location = /bezpieczenstwo.html             { return 301 /#bezpieczenstwo; }
    location = /realizacje.html                 { return 301 /; }
    location = /realizacje/grupa-kono.html      { return 301 /; }
    location = /porownanie.html                 { return 301 /; }
    location = /dla-agencji-pracy.html          { return 301 /; }
    location = /dla-produkcji-i-magazynow.html  { return 301 /; }
    location = /produkty/obieg-dokumentow.html  { return 301 /; }

    # Strony HTML: zawsze sprawdzane na serwerze, żeby zmiany były widoczne od razu
    location / {
        try_files $uri $uri/ =404;
        include snippets/revagy-naglowki.conf;
        add_header Cache-Control "no-cache" always;
    }
    location = /404.html {
        internal;
        include snippets/revagy-naglowki.conf;
        add_header Cache-Control "no-cache" always;
    }

    # Style i skrypty: 1 dzień (adresy mają parametr wersji ?v=)
    location ^~ /assets/css/ {
        try_files $uri =404;
        include snippets/revagy-naglowki.conf;
        add_header Cache-Control "public, max-age=86400" always;
    }
    location ^~ /assets/js/ {
        try_files $uri =404;
        include snippets/revagy-naglowki.conf;
        add_header Cache-Control "public, max-age=86400" always;
    }
    # Fonty, grafiki, filmy: 30 dni
    location ^~ /assets/ {
        try_files $uri =404;
        include snippets/revagy-naglowki.conf;
        add_header Cache-Control "public, max-age=2592000" always;
    }

    location = /site.webmanifest {
        types { }
        default_type application/manifest+json;
        include snippets/revagy-naglowki.conf;
        add_header Cache-Control "public, max-age=86400" always;
    }

    # Pliki ukryte (np. .git) nigdy nie są serwowane
    location ~ /\.(?!well-known) {
        deny all;
    }
}

# --- statystyki: Matomo + raport z logów serwera ---
server {
    listen 127.0.0.1:8092;
    server_name stats.revagy.pl;

    absolute_redirect off;

    access_log /var/log/nginx/revagy/stats.access.log combined;
    error_log  /var/log/nginx/revagy/stats.error.log warn;

    client_max_body_size 16m;
    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header Strict-Transport-Security "max-age=31536000" always;

    # Raport GoAccess z logów serwera (IP, user agent, adresy), za hasłem
    location = /logi {
        return 301 /logi/;
    }
    location ^~ /logi/ {
        alias /var/www/revagy-logi/;
        index index.html;
        auth_basic "REVAGY logi";
        auth_basic_user_file /etc/nginx/revagy-logi.htpasswd;
        add_header X-Robots-Tag "noindex, nofollow" always;
        add_header Cache-Control "no-store" always;
    }

    # Matomo (kontener nasłuchuje tylko lokalnie)
    location / {
        # Na czas instalacji Matomo: jeśli istnieje plik /etc/nginx/revagy-stats-blokada.conf
        # (hasło jak do /logi/), instalator nie jest dostępny publicznie. Po instalacji plik się usuwa.
        include /etc/nginx/revagy-stats-blokada*.conf;
        proxy_pass http://127.0.0.1:8090;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 120s;
    }
}
