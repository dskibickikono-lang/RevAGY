# revagy.pl — strona (pliki statyczne) + stats.revagy.pl (Matomo i raport z logów).
# Instalacja: /etc/nginx/sites-available/revagy.pl.conf + dowiązanie w sites-enabled.
# Wymaga: certyfikatu w /etc/letsencrypt/live/revagy.pl/ (nazwy: revagy.pl, www.revagy.pl, stats.revagy.pl),
#         /etc/nginx/snippets/revagy-naglowki.conf, katalogu /var/log/nginx/revagy/,
#         dowiązania /var/www/revagy.pl/current do aktualnego wydania.

# --- HTTP: odnowienia certyfikatu i przekierowanie na HTTPS ---
server {
    listen 80;
    listen [::]:80;
    server_name revagy.pl www.revagy.pl;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type text/plain;
    }
    location / {
        return 301 https://revagy.pl$request_uri;
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name stats.revagy.pl;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type text/plain;
    }
    location / {
        return 301 https://stats.revagy.pl$request_uri;
    }
}

# --- www → domena główna ---
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.revagy.pl;

    ssl_certificate     /etc/letsencrypt/live/revagy.pl/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/revagy.pl/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    access_log /var/log/nginx/revagy/access.log combined;
    return 301 https://revagy.pl$request_uri;
}

# --- strona ---
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name revagy.pl;

    ssl_certificate     /etc/letsencrypt/live/revagy.pl/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/revagy.pl/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:revagy_ssl:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    root /var/www/revagy.pl/current;
    index index.html;
    charset utf-8;

    # Pełne logi: IP, czas, adres, kod, strona odsyłająca, user agent. Rotacja: 90 dni.
    access_log /var/log/nginx/revagy/access.log combined;
    error_log  /var/log/nginx/revagy/error.log warn;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json application/manifest+json application/xml image/svg+xml text/plain;

    error_page 404 /404.html;

    # Strony HTML: zawsze sprawdzane na serwerze, żeby zmiany były widoczne od razu
    location / {
        try_files $uri $uri/ =404;
        include snippets/revagy-naglowki.conf;
        add_header Cache-Control "no-cache" always;
    }
    location = /404.html {
        internal;
        include snippets/revagy-naglowki.conf;
        add_header Cache-Control "no-cache" always;
    }

    # Style i skrypty: 1 dzień (adresy mają parametr wersji ?v=)
    location ^~ /assets/css/ {
        try_files $uri =404;
        include snippets/revagy-naglowki.conf;
        add_header Cache-Control "public, max-age=86400" always;
    }
    location ^~ /assets/js/ {
        try_files $uri =404;
        include snippets/revagy-naglowki.conf;
        add_header Cache-Control "public, max-age=86400" always;
    }
    # Fonty, grafiki, filmy: 30 dni
    location ^~ /assets/ {
        try_files $uri =404;
        include snippets/revagy-naglowki.conf;
        add_header Cache-Control "public, max-age=2592000" always;
    }

    location = /site.webmanifest {
        types { }
        default_type application/manifest+json;
        include snippets/revagy-naglowki.conf;
        add_header Cache-Control "public, max-age=86400" always;
    }

    # Pliki ukryte (np. .git) nigdy nie są serwowane
    location ~ /\.(?!well-known) {
        deny all;
    }
}

# --- statystyki: Matomo + raport z logów serwera ---
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name stats.revagy.pl;

    ssl_certificate     /etc/letsencrypt/live/revagy.pl/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/revagy.pl/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    access_log /var/log/nginx/revagy/stats.access.log combined;
    error_log  /var/log/nginx/revagy/stats.error.log warn;

    client_max_body_size 16m;
    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header Strict-Transport-Security "max-age=31536000" always;

    # Raport GoAccess z logów serwera (IP, user agent, adresy), za hasłem
    location = /logi {
        return 301 /logi/;
    }
    location ^~ /logi/ {
        alias /var/www/revagy-logi/;
        index index.html;
        auth_basic "REVAGY logi";
        auth_basic_user_file /etc/nginx/revagy-logi.htpasswd;
        add_header X-Robots-Tag "noindex, nofollow" always;
        add_header Cache-Control "no-store" always;
    }

    # Matomo (kontener nasłuchuje tylko lokalnie)
    location / {
        # Na czas instalacji Matomo: jeśli istnieje plik /etc/nginx/revagy-stats-blokada.conf
        # (hasło jak do /logi/), instalator nie jest dostępny publicznie. Po instalacji plik się usuwa.
        include /etc/nginx/revagy-stats-blokada*.conf;
        proxy_pass http://127.0.0.1:8090;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 120s;
    }
}
