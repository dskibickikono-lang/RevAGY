# Matomo (własna analityka) dla stats.revagy.pl.
# Instalacja: /opt/revagy/matomo/docker-compose.yml + plik .env obok (hasła generowane na hoście, nigdy w repo).
# Kontener aplikacji nasłuchuje tylko na 127.0.0.1:8090; na zewnątrz wystawia go nginx.

name: revagy-matomo

services:
  db:
    image: mariadb:11.4
    restart: unless-stopped
    command: --max-allowed-packet=64MB
    environment:
      MARIADB_DATABASE: matomo
      MARIADB_USER: matomo
      MARIADB_PASSWORD: ${MATOMO_DB_PASSWORD:?brak MATOMO_DB_PASSWORD w .env}
      MARIADB_ROOT_PASSWORD: ${MATOMO_DB_ROOT_PASSWORD:?brak MATOMO_DB_ROOT_PASSWORD w .env}
      MARIADB_AUTO_UPGRADE: "1"
    volumes:
      - db:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 12

  app:
    image: matomo:5-apache
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      MATOMO_DATABASE_HOST: db
      MATOMO_DATABASE_ADAPTER: mysql
      MATOMO_DATABASE_TABLES_PREFIX: matomo_
      MATOMO_DATABASE_USERNAME: matomo
      MATOMO_DATABASE_PASSWORD: ${MATOMO_DB_PASSWORD:?brak MATOMO_DB_PASSWORD w .env}
      MATOMO_DATABASE_DBNAME: matomo
    volumes:
      - matomo:/var/www/html
    ports:
      - "127.0.0.1:8090:80"

volumes:
  db:
  matomo:
